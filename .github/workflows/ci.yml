name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn psycopg2-binary sqlalchemy celery redis python-jose "passlib[bcrypt]" python-multipart sslyze dnspython python-whois

      - name: Compile check
        run: |
          python -m compileall api app worker
