services:
  api:
    image: python:3.12-slim
    container_name: sslyze-api
    env_file:
    - .env
    volumes:
      - ./api:/app
      - ./app:/shared
    working_dir: /app
    command: >
      sh -c "pip install fastapi uvicorn psycopg2-binary sqlalchemy &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    image: python:3.12-slim
    container_name: sslyze-worker
    volumes:
      - ./worker:/app
      - ./app:/shared
    working_dir: /app
    command: >
      sh -c "pip install sslyze celery redis psycopg2-binary sqlalchemy &&
             celery -A worker worker --loglevel=info"
    depends_on:
      - redis
      - postgres

  scheduler:
    image: python:3.12-slim
    container_name: sslyze-scheduler
    volumes:
      - ./worker:/app
      - ./app:/shared
    working_dir: /app
    command: >
      sh -c "pip install celery redis &&
             celery -A worker beat --loglevel=info"
    depends_on:
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sslyze
      POSTGRES_USER: sslyze
      POSTGRES_PASSWORD: sslyze
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7