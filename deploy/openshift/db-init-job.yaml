apiVersion: batch/v1
kind: Job
metadata:
  name: tlsaudithub-db-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: postgres:16
          command:
            - sh
            - -c
            - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /schema/init.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tlsaudithub-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: schema
              mountPath: /schema/init.sql
              subPath: init.sql
      volumes:
        - name: schema
          configMap:
            name: tlsaudithub-db-init-sql
